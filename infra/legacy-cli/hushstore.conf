# =============================================================
# HushStore nginx config — Cloudflare Origin Certificate SSL
# Domain: hushstore.io.vn
# Certs: /etc/ssl/cloudflare/origin.pem + origin.key
# =============================================================

# ── Blazor WASM (Static files) ────────────────────────────────
server {
    listen 80;
    server_name hushstore.io.vn www.hushstore.io.vn;
    return 301 https://hushstore.io.vn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hushstore.io.vn www.hushstore.io.vn;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root  /var/www/hushstore/wwwroot;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|wasm|woff2?|png|jpg|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── ASP.NET Core API (Reverse Proxy) ─────────────────────────
server {
    listen 80;
    server_name api.hushstore.io.vn;
    return 301 https://api.hushstore.io.vn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.hushstore.io.vn;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
