# nginx trong image hushstore-web. Chỉ serve static file.
#
# KHÔNG có block ssl_certificate: TLS do ALB terminate bằng ACM cert.
# KHÔNG có block proxy_pass: request tới api.hushstore.io.vn được ALB route
# thẳng sang target group tg-api (container API port 8080), không đi qua nginx.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Blazor publish sẵn cả .gz và .br. Chỉ dùng được .gz: image nginx:alpine
    # KHÔNG biên dịch kèm module brotli, nên `brotli_static` không tồn tại và
    # các file .br chỉ nằm chiếm chỗ trong image. Không xoá chúng ở đây vì đó
    # là việc của Dockerfile; ghi ra để không ai tưởng .br đang được dùng.
    gzip_static on;

    # ─── CHÍNH SÁCH CACHE ────────────────────────────────────────────────
    # Ranh giới duy nhất đáng tin là ĐƯỜNG DẪN, không phải phần mở rộng file.
    # Kiểm chứng bằng `dotnet publish` thật của Client (net10.0):
    #   • 69/69 file trong _framework/ ĐỀU có fingerprint trong tên
    #     (Client.jl3458hu5e.wasm, dotnet.wlxj8pmyhi.js, ...) → đổi nội dung là
    #     đổi tên file, nên cache vĩnh viễn an toàn.
    #   • NGOÀI _framework/ thì KHÔNG file nào có fingerprint: css/app.css,
    #     css/storefront.css, _content/MudBlazor/MudBlazor.min.css và .min.js,
    #     images/*. Tên giữ nguyên qua mọi lần deploy.
    # Cấu hình trước đây gom theo phần mở rộng (\.(js|css|...)$) nên gán
    # `immutable` 1 năm cho cả nhóm thứ hai: một lần deploy chỉ sửa CSS sẽ VÔ
    # HÌNH với trình duyệt cũ trong tới 1 năm — đúng lỗi "stale bundle" mà chính
    # cấu hình đó tồn tại để tránh.
    #
    # Cũng không dùng `expires` chung với `add_header Cache-Control`: `expires`
    # tự phát Cache-Control: max-age=..., cộng thêm add_header thành HAI header
    # Cache-Control trên cùng một response. Chỉ dùng add_header, viết max-age
    # tường minh.

    # Fingerprint trong tên → bất biến.
    location ^~ /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Không có fingerprint → phải cho trình duyệt hỏi lại. 5 phút đủ để giảm
    # request mà deploy vẫn thấy hiệu lực gần như ngay.
    location ~* \.(css|js|wasm|dat|woff2?|png|jpe?g|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # appsettings.json chứa ApiBaseUrl — đổi theo môi trường ở bước build, nên
    # tuyệt đối không được cache lâu.
    location = /appsettings.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # index.html KHÔNG được cache, nếu không người dùng sẽ dính bundle cũ sau
    # mỗi lần deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback: mọi route không khớp file đều trả index.html để Blazor
    # router xử lý phía client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint để ALB tg-web health check. Không ghi access log cho khoẻ.
    # default_type thay vì `add_header Content-Type`: dùng add_header sau
    # `return` làm response có HAI header Content-Type.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
