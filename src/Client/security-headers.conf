# Security headers dùng chung cho Blazor WASM (hushstore.io.vn).
# Phải include vào cả block server và MỌI location có `add_header` riêng vì
# nginx không kế thừa `add_header` từ block cha khi block con khai báo `add_header`.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.hushstore.io.vn https://api-dev.hushstore.io.vn; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
