# ══════════════════════════════════════════════════════════════════════════════
# HAI replica API + nginx round-robin. Toàn bộ hạ tầng cần để chứng minh tính
# đúng đắn đa-instance, và nó $0.
#
# Chạy:
#   cd devops/docker
#   export PG_PASSWORD=...           # mật khẩu của hushstore_postgres_dev
#   export JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
#   docker compose -f docker-compose.multi.yml up --build -d
#   curl -si http://localhost:8088/health/live | grep -i x-upstream
#
# Dừng:  docker compose -f docker-compose.multi.yml down
#
# DB dùng chung với môi trường dev đang chạy trên máy (container
# hushstore_postgres_dev, cổng 5432) — CỐ Ý, vì hai instance phải nhìn thấy
# CÙNG MỘT nguồn sự thật thì bài kiểm mới có nghĩa.
# ══════════════════════════════════════════════════════════════════════════════

x-api-common: &api-common
  build:
    context: ../..
    dockerfile: Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:8080
    # host.docker.internal trỏ về máy thật — PostgreSQL chạy ngoài compose này.
    #
    # ⚠️ SSL Mode=Disable là ĐÚNG Ở ĐÂY và SAI ở mọi nơi khác. Container postgres
    # local không bật TLS, còn RDS thì bắt buộc `SSL Mode=VerifyFull` (xem
    # infra/tf/modules/data). Đừng chép chuỗi này sang Terraform: mã hoá mà không
    # xác thực cert đã là mất im lặng, còn tắt hẳn thì khỏi bàn.
    ConnectionStrings__DefaultConnection: >-
      Host=host.docker.internal;Port=5432;Database=HushStoreDb;Username=hushstore;
      Password=${PG_PASSWORD};SSL Mode=Disable
    JwtSettings__SecretKey: ${JWT_SECRET}
    JwtSettings__Issuer: HushStoreAPI
    JwtSettings__Audience: HushStoreBlazorClient
    AllowedOrigins: http://localhost:8088
  extra_hosts:
    - "host.docker.internal:host-gateway"
  # Hai con số này khớp taskdef ECS (api_memory_hard = 512,
  # api_memory_reservation = 384) để quan sát RAM ở local nói được điều gì đó về
  # production, thay vì đo một cấu hình không tồn tại ở đâu cả.
  mem_limit: 512m
  mem_reservation: 384m
  restart: "no"

services:
  # Hai service TÁCH RIÊNG chứ không phải `--scale api=2`: nginx cần hai tên host
  # phân giải được để round-robin thật sự xảy ra (xem chú thích trong
  # devops/nginx/nginx.multi.conf). Khác biệt duy nhất giữa hai service là cái tên.
  api-1:
    <<: *api-common
    container_name: hushstore_api_1
    # Cổng riêng cho từng replica, KHÔNG qua nginx — bắt buộc để kiểm được các
    # tính chất xuyên instance: gửi lệnh vào ĐÚNG container A rồi đọc kết quả ở
    # ĐÚNG container B. Qua nginx thì không chọn được đích và phép kiểm mất nghĩa.
    ports:
      - "8081:8080"

  api-2:
    <<: *api-common
    container_name: hushstore_api_2
    ports:
      - "8082:8080"

  nginx:
    image: nginx:alpine
    container_name: hushstore_nginx_multi
    ports:
      - "8088:80"
    volumes:
      - ../nginx/nginx.multi.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
    restart: unless-stopped
