# ══════════════════════════════════════════════════════════════════════════════
# nginx đứng trước HAI replica API — bản giả lập ALB để chạy local, $0.
#
# Mục đích KHÔNG phải đo thông lượng. Nó là hạ tầng tối thiểu để chứng minh những
# tính chất chỉ sai khi có nhiều hơn một tiến trình:
#   · trạng thái khoá tài khoản không được nằm trong RAM của một task
#   · seed lúc khởi động không được giết task thứ hai
#   · phiên đăng nhập phải sống sót khi request nhảy sang instance khác
# ══════════════════════════════════════════════════════════════════════════════

upstream hushstore_api {
    # Liệt kê TƯỜNG MINH hai host thay vì dùng `docker compose --scale api=2`.
    #
    # Lý do bắt buộc: nginx phân giải tên trong khối `upstream` ĐÚNG MỘT LẦN lúc
    # khởi động. Với một service được scale, cái tên đó phân giải ra một địa chỉ và
    # nginx gửi 100% traffic vào đúng container đó suốt đời. Vòng lặp kiểm tra vẫn
    # xanh, log vẫn đẹp, và bài kiểm "đa instance" trở thành bài kiểm một instance —
    # đúng loại bằng chứng giả mà bộ đo này sinh ra để loại trừ.
    server api-1:8080 max_fails=0;
    server api-2:8080 max_fails=0;
}

server {
    listen 80;
    server_name localhost;

    # Cho biết container nào đã trả lời. Đây là thứ biến "tôi tin là nó round-robin"
    # thành một phép đo: đếm số giá trị phân biệt của header này.
    add_header X-Upstream $upstream_addr always;

    location / {
        proxy_pass http://hushstore_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # ⚠️ PHẢI có, và phải là 'http' ở local.
        # UseHsts() của API chỉ phát header khi Request.IsHttps, mà giá trị đó lấy
        # từ chính X-Forwarded-Proto. Thiếu dòng này thì hành vi HSTS ở local khác
        # hẳn production và bài kiểm mất ý nghĩa.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
