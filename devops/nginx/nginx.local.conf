# nginx config cho local dev — HTTP only, không cần SSL
server {
    listen 80;
    server_name localhost;

    root /var/www/hushstore/wwwroot;
    index index.html;

    # SPA fallback — tất cả route đều về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tĩnh ngắn để tiện reload khi dev
    location ~* \.(js|css|wasm|woff2?|png|jpg|ico|svg)$ {
        expires 5m;
        add_header Cache-Control "public";
    }
}
