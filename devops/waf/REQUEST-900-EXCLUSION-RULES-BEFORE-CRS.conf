# Exclusion CRS cho HushStore — nạp TRƯỚC luật CRS (tên file "900" < "901").
#
# Quy tắc: hẹp nhất có thể — giới hạn theo REQUEST_FILENAME + đúng tham số
# (ctl:ruleRemoveTargetById; ruleRemoveTargetByTag chỉ khi CŨNG theo path + tham số, như 1002).
# Cấm tắt cả một nhóm luật cho toàn app.
# Mỗi exclusion ghi: ca kiểm thử (devops/waf/test/run.sh), rule ID, vì sao hẹp.
# Rule khớp đã đo bằng RULE_ENGINE=DetectionOnly: docs/evidence/2026-11-08-waf-local.md.
#
# Cùng một file nạp vào CẢ waf-api lẫn waf-web; mỗi exclusion giới hạn theo đường dẫn chỉ
# một trong hai upstream có (/api/... chỉ ở api, /_framework/... chỉ ở web).
# ID dự án dành cho exclusion: 1000–1099.

# ─── 1001 · ca san_pham_tieng_viet · rule 911100 (Method is not allowed by policy) ──────────
# CRS mặc định chỉ cho GET HEAD POST OPTIONS; API REST của app dùng PUT/PATCH/DELETE
# (PUT /api/products/{id}, PATCH .../status, DELETE ...). Không gỡ 911100: chỉ nới DANH SÁCH
# method cho đường dẫn /api/, nên TRACE/CONNECT/method lạ vẫn bị chặn ở /api/, và mọi path
# khác (cả waf-web) vẫn giữ danh sách mặc định. Đặt tx.allowed_methods ở đây (phase 1, trước
# 901160) thì 901160 thấy biến đã có và không ghi đè.
SecRule REQUEST_FILENAME "@beginsWith /api/" \
    "id:1001,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# ─── 1002 · ca mat_khau_kho_*, audit_log_khong_lo_mat_khau · MỌI luật CRS (tag OWASP_CRS) ──
# Mật khẩu không bao giờ thành SQL/lệnh/HTML: Identity băm rồi so, EF tham số hoá. Soi nó chỉ
# sinh dương tính giả (đo: "Abc;ls -la1" → 932xxx, "../x" → 930xxx, "<script>" → 941xxx,
# "\"; DROP" → 942xxx — chỉ gỡ 942100 là không đủ) và tệ hơn: logdata của luật khớp chép
# NGUYÊN VĂN mật khẩu vào audit log ("Matched Data: ... found within ARGS:json.password: <mật khẩu>").
# Phạm vi: ĐÚNG các path nhận mật khẩu (POST /api/auth/login, POST /api/auth/register,
# PUT /api/auth/change-password, POST /api/customers và /api/employees — admin tạo tài khoản),
# ĐÚNG bốn tên trường mật khẩu trong DTO (camelCase). Mọi trường khác trên các path này (email,
# fullName…) vẫn bị soi đủ; mọi path khác không đổi. App không có endpoint đặt lại mật khẩu.
# t:lowercase: ASP.NET định tuyến không phân biệt hoa/thường ("api/[controller]" = /api/Auth/...).
SecRule REQUEST_FILENAME "@rx ^/api/(?:auth/(?:login|register|change-password)|customers|employees)/?$" \
    "id:1002,\
    phase:1,\
    pass,\
    t:none,t:lowercase,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.confirmPassword,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.currentPassword,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.newPassword"

# ─── 1003 · ca health_host_ip, health_web · rule 920350 (Host header is a numeric IP) ───────
# Health check của ALB gửi Host là IP target (10.0.1.23:8080). 920350 chỉ +3 điểm (dưới
# ngưỡng 5) nên KHÔNG tự chặn, nhưng với RelevantOnly nó ghi một bản audit log cho MỖI lần
# health check (vài giây một lần, mỗi target) — rác CloudWatch, và chỉ cần một luật +2 nữa
# là ALB rút target. Chỉ gỡ header Host khỏi 920350 ở đúng hai path health của ALB
# (infra/tf/modules/alb/alb.tf: /health/ready cho api, /healthz cho web).
SecRule REQUEST_FILENAME "@rx ^/(?:health/ready|healthz)$" \
    "id:1003,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetById=920350;REQUEST_HEADERS:Host"

# ─── 1004 · ca blazor_framework · rule 920440 (URL file extension is restricted) ───────────
# Blazor WASM tải App.dll, icudt.dat từ /_framework/; .dll và .dat nằm trong
# tx.restricted_extensions mặc định của CRS. Chỉ gỡ khi CẢ HAI: path dưới /_framework/ VÀ
# đuôi đúng .dll/.dat — mọi đuôi cấm khác (.bak, .config, .sql…) vẫn bị chặn kể cả trong
# /_framework/, và .dll/.dat ở chỗ khác vẫn bị chặn. Path traversal (/_framework/../x.dat)
# vẫn do nhóm 930 chặn.
SecRule REQUEST_FILENAME "@beginsWith /_framework/" \
    "id:1004,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_BASENAME "@rx \.(?:dll|dat)$" \
        "t:none,t:urlDecodeUni,t:lowercase,\
        ctl:ruleRemoveTargetById=920440;REQUEST_BASENAME"
