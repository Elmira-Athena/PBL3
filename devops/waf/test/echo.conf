# Upstream giả cho bộ kiểm thử WAF: mọi path trả 200 và in lại đúng ba header mà WAF phải
# chuyển NGUYÊN VĂN. client_max_body_size 10m để body 9 MB (ca body_qua_8mb) nếu lọt WAF thì
# vẫn tới được đây và ca đó đỏ — không để trần của chính echo che mất lỗi của WAF.
server {
    listen 80;
    client_max_body_size 10m;

    location / {
        default_type text/plain;
        return 200 "$http_x_forwarded_for|$http_x_forwarded_proto|$host";
    }
}
