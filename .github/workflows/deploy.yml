name: Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/elmira-athena/hushstore-api

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'src/Client/**'
              - 'src/Shared/**'

      - uses: actions/setup-dotnet@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Build Blazor WASM
        if: steps.changes.outputs.frontend == 'true'
        run: |
          dotnet publish src/Client/Client.csproj \
            -c Release -o /tmp/blazor-out \
            --nologo -v q

      - name: Setup SSH
        if: steps.changes.outputs.frontend == 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Rsync to EC2
        if: steps.changes.outputs.frontend == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          rsync -a --delete \
            -e "ssh -i ~/.ssh/deploy.pem" \
            /tmp/blazor-out/wwwroot/ \
            ubuntu@$EC2_HOST:/var/www/hushstore/wwwroot/
          echo "Frontend deployed"

  build-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'src/API/**'
              - 'src/Service/**'
              - 'src/Infrastructure/**'
              - 'src/Core/**'
              - 'src/Shared/**'
              - 'Dockerfile'

      - name: Login to ghcr.io
        if: steps.changes.outputs.api == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        if: steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy-api:
    name: Deploy API to EC2
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - uses: actions/checkout@v4

      - name: Check changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'src/API/**'
              - 'src/Service/**'
              - 'src/Infrastructure/**'
              - 'src/Core/**'
              - 'src/Shared/**'
              - 'Dockerfile'
              - 'docker-compose.yml'

      - name: Setup SSH
        if: steps.changes.outputs.api == 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Pull & restart on EC2
        if: steps.changes.outputs.api == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy.pem ubuntu@$EC2_HOST \
            GH_TOKEN="$GH_TOKEN" GH_ACTOR="$GH_ACTOR" \
            bash << 'ENDSSH'
            set -e
            cd /opt/hushstore
            git pull origin main
            echo "$GH_TOKEN" | sudo docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            sudo docker compose pull api
            sudo docker compose up -d api
            echo "API restarted"
          ENDSSH

      - name: Health check
        if: steps.changes.outputs.api == 'true'
        run: |
          sleep 30
          for i in 1 2 3 4 5; do
            if curl -sf https://api.hushstore.io.vn/health > /dev/null; then
              echo "✓ API is healthy"
              exit 0
            fi
            echo "Retry $i/5..."
            sleep 15
          done
          echo "✗ Health check failed"
          exit 1
