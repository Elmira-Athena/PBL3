# Deploy production.
#
# ─── KHÁC GÌ SO VỚI PIPELINE CŨ ──────────────────────────────────────────────
# Pipeline trước Phase 2 deploy bằng SSH: một private key nằm trong GitHub
# Secrets (`EC2_SSH_KEY`), không hết hạn, `rsync` file lên host rồi
# `docker compose up`. Ba vấn đề, cả ba đều là vấn đề về bản chất chứ không phải
# về cấu hình:
#   • credential dài hạn — ai đọc được secret là vào được máy chủ, mãi mãi;
#   • tag `latest` — không nói được "đang chạy commit nào", nên rollback là đoán;
#   • migration chạy lúc app khởi động — không ai gate được, fail thì crash-loop.
#
# Pipeline này: OIDC (không credential), tag = git SHA (ECR bật IMMUTABLE nên
# không ghi đè được), và migration là một ECS task riêng mà exit code của nó
# quyết định có deploy hay không.
#
# ─── GATE MIGRATION CHẠY IMAGE NÀO ───────────────────────────────────────────
# Nó chạy `hushstore-migrator` ở ĐÚNG tag `$GITHUB_SHA` của lần push này, và điều
# đó chỉ đúng vì job `deploy` ĐĂNG KÝ một revision migrator mới trước khi
# `run-task`. Gọi `run-task --task-definition hushstore-migrator` (chỉ family)
# thì ECS resolve về revision ACTIVE mới nhất — tức revision do `terraform apply`
# đăng ký, mà image của revision đó là `image_tag` ghim tay trong
# terraform.tfvars, KHÔNG phải commit vừa push. Hệ quả nếu làm vậy: efbundle cũ
# không chứa migration mới, nó exit 0, gate PASS, rồi api/web ở SHA mới được
# deploy lên một schema thiếu migration — và không có tín hiệu nào ở đâu cả, vì
# /health/ready chỉ kiểm kết nối chứ không kiểm schema.
# Nên: register TRƯỚC, rồi run-task bằng ARN có revision. Xem bước
# "Đăng ký 3 revision" và "Chạy task migrator" bên dưới.
#
# ─── VÌ SAO NÓ KHÔNG TỰ BẬT HẠ TẦNG ──────────────────────────────────────────
# `enable_alb`, `enable_nat`, `instance_count` mặc định TẮT, và mỗi giờ bật tốn
# $0.1954 (đo thật — xem docs/terraform-runbook.md). Một pipeline tự bật hạ tầng
# nghĩa là mỗi lần push vào main là một lần bắt đầu tính tiền, và không ai nhận
# ra cho tới lúc đọc hoá đơn. Rủi ro đó không có trần trên.
#
# Nên pipeline chỉ ĐỌC trạng thái rồi phân nhánh (job `preflight`):
#   • hạ tầng đang chạy  -> build, migrate, deploy
#   • hạ tầng đang tắt   -> build và push thôi, job VẪN XANH
# Nhánh thứ hai là trạng thái bình thường của dự án này, không phải lỗi. Nhưng
# nó phải hiện rõ trong summary — "Actions xanh mà chưa deploy" đúng là loại
# nhầm lẫn làm mất cả buổi debug.
#
# IAM role của pipeline KHÔNG có autoscaling:SetDesiredCapacity và không có
# rds:StartDBInstance, nên ràng buộc này được canh ở tầng quyền chứ không chỉ ở
# comment. Xem infra/tf/modules/cicd/policy.tf.

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write là quyền BẮT BUỘC để job xin được OIDC token từ GitHub. Không
# có nó, configure-aws-credentials báo "Could not load credentials" mà không nói
# vì sao. contents: read là mặc định tối thiểu — pipeline không cần ghi gì vào repo.
permissions:
  contents: read
  id-token: write

# Không cho hai deploy chạy chồng nhau: cả hai sẽ cùng register task definition
# và cùng update-service, kết quả là service trỏ vào revision của lần chạy tới
# sau nhưng migration của lần chạy tới trước. cancel-in-progress = false vì hủy
# giữa lúc migration đang chạy còn tệ hơn là chờ.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  CLUSTER: hushstore
  RDS_ID: hushstore-db-tf
  # Không có MIGRATOR_FAMILY ở đây, có chủ ý: từ khi gate register revision
  # trước khi chạy, bước migrate nhận ARN ĐẦY ĐỦ CÓ REVISION (`$TD_MIGRATOR`) chứ
  # không nhận tên family. Một biến `MIGRATOR_FAMILY` còn sót lại sẽ là cái núm
  # không nối vào đâu: sửa nó không đổi gì, mà người sửa lại tin là có.
  MIGRATOR_LOG_GROUP: /ecs/hushstore-migrator
  CAPACITY_PROVIDER: hushstore-cp
  SERVICE_WEB: hushstore-web
  SERVICE_API: hushstore-api
  # TRÙNG LẶP BẮT BUỘC: giá trị này còn xuất hiện lần thứ hai ở
  # `build_args` của matrix image `web` bên dưới. `strategy.matrix` được
  # GitHub đánh giá TRƯỚC khi context `env` của workflow tồn tại, nên không
  # tham chiếu được `${{ env.API_BASE_URL }}` ở đó. SỬA THÌ PHẢI SỬA CẢ HAI:
  # nếu lệch, health check ở cuối job gọi một URL còn bundle Blazor gọi một
  # URL khác, và build-arg không dùng chỉ là warning nên Docker không báo gì.
  API_BASE_URL: https://api.hushstore.io.vn

jobs:
  # ───────────────────────────────────────────────────────────────
  # BUILD — luôn chạy, không phụ thuộc trạng thái hạ tầng.
  # Push được image lên ECR mà không cần hạ tầng bật: ECR là endpoint công khai,
  # không đi qua NAT Gateway. Chỉ việc PULL từ trong private subnet mới cần NAT.
  # ───────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      # fail-fast: bốn image phải cùng một SHA mới deploy được. Nếu một cái
      # fail thì ba cái kia là rác — dừng luôn để khỏi tốn phút runner.
      fail-fast: true
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile
            build_args: ""
          - image: web
            dockerfile: src/Client/Dockerfile
            # ApiBaseUrl bị BAKE vào bundle lúc build — đó là bản chất của
            # Blazor WASM standalone, nó không đọc được biến môi trường lúc
            # runtime. Nên URL phải là build-arg, không phải env của container.
            #
            # Đây là BẢN SAO của `env.API_BASE_URL` ở đầu file, viết cứng vì
            # matrix không đọc được context `env`. Sửa một chỗ mà quên chỗ kia
            # là lỗi im lặng — xem comment ở env.API_BASE_URL.
            build_args: API_BASE_URL=https://api.hushstore.io.vn
          - image: migrator
            dockerfile: src/Infrastructure/Dockerfile.migrator
            build_args: ""
          - image: seeder
            dockerfile: src/Infrastructure/Dockerfile.seeder
            build_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Assume role qua OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-${{ matrix.image }}

      - name: Đăng nhập ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR bật image_tag_mutability = IMMUTABLE. Nghĩa là push lại cùng một tag
      # bị TỪ CHỐI, không phải ghi đè — đó là điều kiện để rollback bằng cách trỏ
      # lại revision cũ thực sự đáng tin. Hệ quả thực tế: bấm "Re-run jobs" trên
      # một commit đã build xong sẽ fail ở bước push nếu không kiểm tra trước.
      - name: Image đã tồn tại chưa
        id: exists
        env:
          REPO: hushstore-${{ matrix.image }}
        run: |
          if aws ecr describe-images \
               --repository-name "$REPO" \
               --image-ids "imageTag=$GITHUB_SHA" \
               --no-cli-pager >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bỏ qua build $REPO::Image $REPO:$GITHUB_SHA đã có trên ECR (tag IMMUTABLE nên không push lại được, và không cần push lại)."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build và push
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # linux/amd64 tường minh: Dockerfile.migrator và Dockerfile.seeder đã
          # pin --platform trong FROM, nhưng api và web thì chưa — và đích đến
          # là t3.micro (Intel). Runner hiện là x64 nên đây là no-op, nhưng nó
          # bảo hiểm cho ngày GitHub đổi runner mặc định sang arm64.
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/hushstore-${{ matrix.image }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ───────────────────────────────────────────────────────────────
  # SCRIPT MIGRATION — artifact để người review đọc được đúng câu SQL sẽ chạy
  # lên DB thật, trước khi nó chạy. Cũng là một bước kiểm tra: sinh script fail
  # nghĩa là tập migration không nhất quán, và biết điều đó ở đây rẻ hơn nhiều
  # so với biết nó lúc task migrator đã bắt đầu sửa schema.
  # ───────────────────────────────────────────────────────────────
  migration-script:
    name: Sinh migrate-<sha>.sql
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Assume role qua OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-migration-script

      - name: Sinh script idempotent
        # --idempotent bọc mỗi migration trong IF NOT EXISTS, nên script chạy
        # được trên một DB đang ở BẤT KỲ version nào — kể cả DB đã áp một phần.
        #
        # Hai biến môi trường dưới đây là GIẢ và chỉ tồn tại trong runner:
        # `dotnet ef` dựng DbContext bằng cách chạy lại entry point của API, nên
        # nó đọc cấu hình theo đúng cơ chế của app.
        #
        # Chúng đặt ở đây để TƯỜNG MINH HOÁ cấu hình design-time, KHÔNG phải để
        # tránh một exception. `src/API/Program.cs:110` đúng là có
        # `?? throw` trên `JwtSettings:SecretKey`, nhưng `??` chỉ bắn khi giá trị
        # là null, mà `src/API/appsettings.json` khai `"SecretKey": ""` — chuỗi
        # RỖNG. Nên bỏ biến này đi thì `dotnet ef` vẫn chạy. Giữ vì hai lẽ: nó
        # nói ra rằng bước này cố tình chạy với secret giả, và nó vẫn đúng vào
        # ngày ai đó xoá dòng rỗng kia khỏi appsettings.json.
        #
        # Sinh script KHÔNG kết nối DB — connection string chỉ cần phân tích được
        # cú pháp, không cần tới được server.
        env:
          JwtSettings__SecretKey: design-time-only-placeholder-not-a-real-secret-32b
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=design_time;User Id=sa;Password=placeholder;TrustServerCertificate=True"
        run: |
          dotnet tool install --global dotnet-ef --version '10.0.*'
          export PATH="$PATH:$HOME/.dotnet/tools"

          # BẮT BUỘC restore trước. `dotnet ef` hỏi metadata của project bằng
          # MSBuild target GetEFProjectMetadata, và target đó chạy TRƯỚC bước
          # build nên nó KHÔNG tự restore. Không có project.assets.json thì lỗi
          # là NETSDK1004 "Assets file not found", theo sau là "Unable to
          # retrieve project metadata" — thông báo dễ làm tưởng project hỏng
          # chứ không phải thiếu restore.
          dotnet restore PBL3.sln

          dotnet ef migrations script \
            --idempotent \
            --project src/Infrastructure/Infrastructure.csproj \
            --startup-project src/API/API.csproj \
            --configuration Release \
            -o "migrate-${GITHUB_SHA}.sql"
          wc -l "migrate-${GITHUB_SHA}.sql"

      - name: Upload lên S3 và vào artifact của build
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          aws s3 cp "migrate-${GITHUB_SHA}.sql" \
            "s3://hushstore-artifacts-${ACCOUNT}/migrations/migrate-${GITHUB_SHA}.sql"

      - uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: migrate-*.sql
          retention-days: 14

  # ───────────────────────────────────────────────────────────────
  # PREFLIGHT — chỉ đọc. Quyết định có deploy hay không.
  # ───────────────────────────────────────────────────────────────
  preflight:
    name: Hạ tầng đang chạy?
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      reason: ${{ steps.check.outputs.reason }}

    steps:
      - name: Assume role qua OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-preflight

      - name: Đọc trạng thái thật trên AWS
        id: check
        run: |
          set -uo pipefail

          # RDS. `|| echo` để một DB chưa tồn tại không làm job đỏ — "chưa có"
          # là một câu trả lời hợp lệ ở đây, không phải sự cố.
          rds=$(aws rds describe-db-instances \
                  --db-instance-identifier "$RDS_ID" \
                  --query 'DBInstances[0].DBInstanceStatus' \
                  --output text 2>/dev/null || echo "missing")

          # Container instance. Migration là task bridge trên EC2 launch type
          # nên nó BẮT BUỘC cần một host đã đăng ký vào cluster — không có host
          # thì run-task nằm ở PROVISIONING mãi rồi timeout.
          hosts=$(aws ecs list-container-instances \
                    --cluster "$CLUSTER" --status ACTIVE \
                    --query 'length(containerInstanceArns)' \
                    --output text 2>/dev/null || echo 0)

          # Service. Lọc status == ACTIVE vì describe-services CÒN TRẢ VỀ service
          # đã xoá với status INACTIVE trong một khoảng thời gian sau đó — đếm cả
          # INACTIVE là kết luận sai rằng stack đang chạy.
          svcs=$(aws ecs describe-services \
                   --cluster "$CLUSTER" --services "$SERVICE_WEB" "$SERVICE_API" \
                   --query 'length(services[?status==`ACTIVE`])' \
                   --output text 2>/dev/null || echo 0)

          echo "RDS=$rds  container_instance=$hosts  service_ACTIVE=$svcs"

          # `${reason:+$reason }` chèn dấu cách CHỈ KHI reason đã có nội dung.
          # Nối thẳng "$reason ..." vào chuỗi rỗng sẽ để lại một dấu cách đầu,
          # và chuỗi này hiện nguyên văn trong blockquote của summary.
          reason=""
          [ "$rds" = "available" ] || reason="${reason:+$reason }RDS đang ở trạng thái '$rds' (cần 'available')."
          [ "$hosts" -ge 1 ]      || reason="${reason:+$reason }Không có container instance nào ACTIVE (instance_count = 0)."
          [ "$svcs" -eq 2 ]       || reason="${reason:+$reason }Chỉ có $svcs/2 ECS service ACTIVE (enable_alb = false)."

          if [ -z "$reason" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "reason=Hạ tầng đang chạy đủ để deploy." >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────────────────────────
  # DEPLOY — chỉ chạy khi hạ tầng đang bật.
  # ───────────────────────────────────────────────────────────────
  deploy:
    name: Migrate rồi deploy
    runs-on: ubuntu-latest
    needs: [build, migration-script, preflight]
    if: needs.preflight.outputs.ready == 'true'

    steps:
      - name: Assume role qua OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy

      - name: Ghi lại revision đang chạy (để rollback được)
        run: |
          set -euo pipefail
          for pair in "api:$SERVICE_API" "web:$SERVICE_WEB"; do
            key=${pair%%:*}; svc=${pair#*:}
            prev=$(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
                     --query 'services[0].taskDefinition' --output text)
            # Tên biến VIẾT HOA: bước rollback đọc nó qua `env.PREV_API` trong
            # biểu thức `if:`, và context env của GitHub phân biệt hoa thường.
            echo "PREV_$(echo "$key" | tr '[:lower:]' '[:upper:]')=${prev}" >> "$GITHUB_ENV"
            echo "$svc đang chạy $prev"
          done

      # ─── VÌ SAO REGISTER TRƯỚC KHI MIGRATE ───────────────────────
      # Gate migration chỉ có nghĩa nếu nó chạy efbundle của ĐÚNG commit này.
      # `run-task --task-definition hushstore-migrator` (chỉ family) resolve về
      # revision ACTIVE mới nhất — revision của Terraform, dựng từ `image_tag`
      # ghim tay — nên nó chạy efbundle CŨ, exit 0, và gate PASS trên một schema
      # thiếu đúng migration vừa thêm. Vì thế cả ba revision đăng ký ở đây,
      # TRƯỚC gate.
      #
      # Đăng ký KHÔNG phải deploy: một revision mới không chạy ở đâu cả cho tới
      # khi có `update-service` trỏ vào nó, và bước đó nằm SAU gate. Nên đăng ký
      # sớm cho api/web là vô hại; giá phải trả là khi migration fail thì để lại
      # 2 revision không ai dùng — task definition không tính tiền, và
      # `skip_destroy = true` vốn đã giữ mọi revision cũ để rollback được.
      #
      # Vòng lặp gộp cả ba vì phần thân giống hệt nhau: describe → jq đổi field
      # image → guard theo tên container → register. Tách thành hai bản sao thì
      # ngày ai đó thêm một field read-only mới vào `del(...)` ở một bản, bản kia
      # trả ValidationException ở đúng nửa không được sửa. `update-service` KHÔNG
      # nằm trong vòng này — migrator không có service nào — nó là bước riêng
      # sau gate.
      - name: Đăng ký 3 revision trỏ vào image vừa build
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          for key in migrator api web; do
            # Lấy revision ACTIVE mới nhất của family làm khuôn, rồi đổi ĐÚNG
            # field image. Nghĩa là mọi thay đổi hình dạng do Terraform apply
            # (RAM, secret, log) được kế thừa tự nhiên, và pipeline không cần
            # biết gì về hình dạng đó.
            aws ecs describe-task-definition --task-definition "hushstore-${key}" \
              --query 'taskDefinition' --no-cli-pager > "td-${key}.json"

            # Các field bị `del` là READ-ONLY do AWS sinh ra; gửi lại chúng vào
            # register-task-definition là lỗi ValidationException.
            # Chọn container THEO TÊN, không theo chỉ số [0]. Hôm nay mỗi task
            # definition chỉ có một container nên hai cách tương đương, nhưng
            # nếu mai có người thêm một sidecar thì [0] sẽ đổi image của sai
            # container mà pipeline vẫn xanh.
            jq --arg img "${REGISTRY}/hushstore-${key}:${GITHUB_SHA}" --arg name "$key" \
               '.containerDefinitions |= map(if .name == $name then .image = $img else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
               "td-${key}.json" > "new-td-${key}.json"

            # Nếu tên container không khớp thì jq ở trên là no-op và revision mới
            # mang đúng image CŨ — im lặng và rất khó phát hiện. Với migrator, đó
            # chính là lỗi mà cả bước này tồn tại để chặn. Chặn ngay ở đây.
            grep -q "hushstore-${key}:${GITHUB_SHA}" "new-td-${key}.json" || {
              echo "::error title=Không đổi được image::Không tìm thấy container tên '${key}' trong task definition hushstore-${key}. Kiểm tra modules/ecs/taskdef.tf."
              exit 1
            }

            NEW=$(aws ecs register-task-definition --cli-input-json "file://new-td-${key}.json" \
                    --query 'taskDefinition.taskDefinitionArn' --output text --no-cli-pager)

            # Ghi qua $GITHUB_ENV vì mỗi `run:` là một shell RIÊNG — biến shell
            # của bước này không tồn tại ở bước sau. Bước migrate đọc
            # $TD_MIGRATOR, bước update-service đọc $TD_API và $TD_WEB. Cùng cơ
            # chế đã dùng cho PREV_* và SNAP.
            echo "TD_$(echo "$key" | tr '[:lower:]' '[:upper:]')=${NEW}" >> "$GITHUB_ENV"
            echo "$key -> $NEW"
          done

      # Snapshot = điểm quay về cho DỮ LIỆU. Chính sách migration là
      # forward-only (không dùng down-migration), nên đây là đường rollback duy
      # nhất nếu một migration làm hỏng dữ liệu chứ không chỉ hỏng schema.
      #
      # KHÔNG chờ snapshot chuyển sang `available`. Điểm khôi phục của một
      # snapshot là THỜI ĐIỂM BẮT ĐẦU tạo, nên nó đã đúng ngay khi câu lệnh trả
      # về; chờ thêm 3-5 phút chỉ để nhìn nó copy xong là chờ vô ích. Nhưng vẫn
      # phải KIỂM CHỨNG nó thành công — làm ở bước sau, sau khi migrate.
      - name: Snapshot trước khi migrate
        run: |
          set -euo pipefail
          # $GITHUB_RUN_ATTEMPT là phần BẮT BUỘC của tên, không phải trang trí:
          # "Re-run failed jobs" giữ NGUYÊN cả GITHUB_SHA và GITHUB_RUN_NUMBER —
          # chỉ RUN_ATTEMPT tăng. Thiếu nó, mọi lần chạy lại gặp
          # DBSnapshotAlreadyExists, `set -euo pipefail` giết bước này, và job
          # chết TRƯỚC khi migrate với một lỗi RDS không liên quan gì tới thứ
          # thật sự đã fail lần trước.
          # Giới hạn tên snapshot của RDS là 255 ký tự, chữ/số/dấu gạch:
          # "pre-migrate-" + 8 + "-" + số + "-" + số còn cách xa giới hạn đó.
          SNAP="pre-migrate-${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "SNAP=$SNAP" >> "$GITHUB_ENV"
          aws rds create-db-snapshot \
            --db-instance-identifier "$RDS_ID" \
            --db-snapshot-identifier "$SNAP" \
            --query 'DBSnapshot.{id:DBSnapshotIdentifier,status:Status}' \
            --no-cli-pager

      - name: Chạy task migrator và lấy exit code
        id: migrate
        run: |
          set -uo pipefail

          # ─── CHỐT CUỐI CHO LỖI IM LẶNG DUY NHẤT CỦA PHASE NÀY ────────────────
          # Trước khi chạy, ĐỌC LẠI từ AWS xem task definition này thật sự mang
          # image tag nào. Không tin biến, không tin comment — hỏi AWS.
          #
          # Vì sao cần: nếu có ngày ai đó đổi `--task-definition "$TD_MIGRATOR"`
          # về `"$MIGRATOR_FAMILY"`, hoặc bước register bị bỏ, thì migration chạy
          # efbundle CŨ, exit 0, gate PASS, và code mới deploy lên schema thiếu
          # migration — job vẫn XANH. Đó là lỗi im lặng duy nhất còn lại trong
          # Phase này, và 67 test Terraform không canh được nó vì nó nằm trong
          # YAML chứ không nằm trong HCL.
          #
          # Khẳng định ở runtime thì bền hơn bất kỳ cách so khớp văn bản nào: nó
          # đúng bất kể tương lai người ta chọn task definition bằng cách gì.
          # `ecs:DescribeTaskDefinition` đã được cấp sẵn nên không cần đổi IAM.
          IMG=$(aws ecs describe-task-definition --task-definition "$TD_MIGRATOR" \
                  --query 'taskDefinition.containerDefinitions[?name==`migrator`].image | [0]' \
                  --output text --no-cli-pager)
          echo "Task definition sắp chạy: $TD_MIGRATOR"
          echo "  image: $IMG"
          case "$IMG" in
            *":${GITHUB_SHA}")
              echo "  -> đúng commit của lần push này." ;;
            *)
              echo "::error title=Migrator KHÔNG mang image của commit này::Task definition $TD_MIGRATOR có image '$IMG', không kết thúc bằng ':${GITHUB_SHA}'. Chạy nó nghĩa là gate migration kiểm một efbundle CŨ rồi báo PASS. DỪNG. Kiểm tra bước 'Đăng ký 3 revision' và giá trị \$TD_MIGRATOR."
              exit 1 ;;
          esac

          # ARN CÓ REVISION, không phải tên family. $TD_MIGRATOR do bước "Đăng ký
          # 3 revision" ghi ra và nó trỏ vào hushstore-migrator:$GITHUB_SHA.
          # Truyền tên family ở đây là chạy revision của Terraform, tức efbundle
          # dựng từ `image_tag` cũ — xem "GATE MIGRATION CHẠY IMAGE NÀO" ở đầu file.
          #
          # Hứng CẢ response thay vì `--query tasks[0].taskArn`: khi ECS không xếp
          # được task thì `tasks` rỗng và nguyên nhân THẬT nằm trong `failures[]`
          # (`RESOURCE:MEMORY` = host không còn RAM, `AGENT` = ecs-agent không kết
          # nối, `ATTRIBUTE` = không host nào thoả requiresAttributes). Ba nguyên
          # nhân đó dẫn tới ba việc phải làm khác nhau hoàn toàn, nên in ra cái
          # ECS nói còn hơn đoán một cái nghe hợp lý.
          RESP=$(aws ecs run-task \
                   --cluster "$CLUSTER" \
                   --task-definition "$TD_MIGRATOR" \
                   --capacity-provider-strategy "capacityProvider=${CAPACITY_PROVIDER},weight=1" \
                   --output json --no-cli-pager)

          TASK=$(printf '%s' "$RESP" | jq -r '.tasks[0].taskArn // empty')

          if [ -z "$TASK" ]; then
            echo "::error title=Không khởi được task migrator::run-task không trả về taskArn. Nguyên nhân do ECS trả về nằm ngay dưới đây."
            printf '%s' "$RESP" | jq -r '.failures // [] | if length == 0
              then "  (ECS không trả failures[] nào — kiểm tra tên cluster và capacity provider)"
              else (.[] | "  arn=\(.arn // "-")  reason=\(.reason // "-")  detail=\(.detail // "-")") end'
            exit 1
          fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "Task: $TASK"

          # Poll thay vì `aws ecs wait tasks-stopped`: waiter không in gì trong
          # lúc chờ, nên một job treo 10 phút trông y như một job chết. Ở đây mỗi
          # 10 giây in một dòng, và timeout là tường minh.
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            read -r status exitcode reason <<<"$(aws ecs describe-tasks \
              --cluster "$CLUSTER" --tasks "$TASK" \
              --query 'tasks[0].[lastStatus,containers[0].exitCode,stoppedReason]' \
              --output text --no-cli-pager)"
            echo "  $(date -u +%H:%M:%S) lastStatus=$status exitCode=$exitcode"
            [ "$status" = "STOPPED" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=Migration timeout::Task vẫn ở $status sau 15 phút. Task KHÔNG bị hủy — nó vẫn chạy phía AWS; kiểm tra bằng describe-tasks."
              exit 1
            fi
            sleep 10
          done

          echo "exit_code=$exitcode" >> "$GITHUB_OUTPUT"

          if [ "$exitcode" != "0" ]; then
            echo "::error title=Migration THẤT BẠI (exit $exitcode)::KHÔNG deploy. Bản đang chạy vẫn phục vụ bình thường. stoppedReason: $reason"
            echo "── log của task migrator ─────────────────────────────"
            # Stream name của awslogs driver: <prefix>/<container>/<task-id>.
            # Tên này được SUY RA, không được AWS đảm bảo: nó phụ thuộc
            # awslogs-stream-prefix trong modules/ecs/taskdef.tf. Nếu prefix đó
            # đổi thì đoán sai, và bước này im lặng không in được log ở đúng
            # lúc người ta cần log nhất — nên có nhánh dự phòng bên dưới.
            TASK_ID="${TASK##*/}"
            LOGS=$(aws logs get-log-events \
                     --log-group-name "$MIGRATOR_LOG_GROUP" \
                     --log-stream-name "migrator/migrator/${TASK_ID}" \
                     --query 'events[].message' --output text --no-cli-pager 2>/dev/null || true)

            if [ -n "$LOGS" ] && [ "$LOGS" != "None" ]; then
              echo "$LOGS"
            else
              echo "(không đọc được stream đoán tên 'migrator/migrator/${TASK_ID}' — dò stream thật)"
              # Sắp theo LastEventTime giảm dần: stream của task vừa chết là
              # stream có event mới nhất.
              STREAMS=$(aws logs describe-log-streams \
                          --log-group-name "$MIGRATOR_LOG_GROUP" \
                          --order-by LastEventTime --descending --max-items 5 \
                          --query 'logStreams[].logStreamName' \
                          --output text --no-cli-pager 2>/dev/null || true)
              echo "Các stream đang có trong $MIGRATOR_LOG_GROUP:"
              for s in $STREAMS; do echo "  - $s"; done

              NEWEST=$(printf '%s\n' $STREAMS | head -1)
              if [ -n "$NEWEST" ] && [ "$NEWEST" != "None" ]; then
                echo "── thử stream mới nhất: $NEWEST"
                aws logs get-log-events \
                  --log-group-name "$MIGRATOR_LOG_GROUP" \
                  --log-stream-name "$NEWEST" \
                  --query 'events[].message' --output text --no-cli-pager 2>/dev/null \
                  || echo "(vẫn không đọc được — kiểm tra trên CloudWatch: $MIGRATOR_LOG_GROUP)"
              else
                echo "(log group rỗng hoặc không đọc được — kiểm tra trên CloudWatch: $MIGRATOR_LOG_GROUP)"
              fi
            fi
            exit 1
          fi

          echo "Migration thành công (exit 0)."

      - name: Kiểm chứng snapshot đã hoàn tất
        # Chạy sau migrate, không chặn migrate. Nếu snapshot fail thì phải biết
        # NGAY — chứ không phải biết vào lúc cần nó để khôi phục.
        run: |
          set -uo pipefail
          st=$(aws rds describe-db-snapshots --db-snapshot-identifier "$SNAP" \
                 --query 'DBSnapshots[0].Status' --output text 2>/dev/null || echo missing)
          if [ "$st" = "available" ] || [ "$st" = "creating" ]; then
            echo "Snapshot $SNAP: $st"
          else
            echo "::warning title=Snapshot có vấn đề::$SNAP đang ở trạng thái '$st'. Migration ĐÃ chạy, nhưng điểm quay về cho dữ liệu không đáng tin. Kiểm tra thủ công."
          fi

      # Đây là bước ĐẦU TIÊN chạm vào thứ đang phục vụ khách. Mọi thứ trước nó
      # (register revision, snapshot, migrate) đều có thể fail mà production
      # không hề đổi. Revision đã đăng ký từ trước gate, nên ở đây chỉ còn việc
      # trỏ service sang — không có `describe`/`jq`/`register` nào giữa gate và
      # lúc service đổi.
      - name: Trỏ hai service sang revision mới
        run: |
          set -euo pipefail
          # Hai lệnh thẳng, không gói "key:service" vào chuỗi rồi cắt như các
          # bước khác: ARN của task definition tự nó CHỨA dấu ':'
          # (…:task-definition/hushstore-api:42), nên một lần dùng sai `%%:*` là
          # ra rác mà không ai thấy.
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE_API" \
            --task-definition "$TD_API" --no-cli-pager >/dev/null
          echo "$SERVICE_API -> $TD_API"

          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE_WEB" \
            --task-definition "$TD_WEB" --no-cli-pager >/dev/null
          echo "$SERVICE_WEB -> $TD_WEB"

      # `wait services-stable` là GATE THẬT của deploy, không phải curl ở dưới.
      # Service chỉ được coi là stable khi deployment hoàn tất, mà điều đó đòi
      # target trong target group phải healthy — và health check của tg-api là
      # /health/ready, endpoint có AddDbContextCheck nên nó MỞ KẾT NỐI TỚI RDS.
      # Nói cách khác: stable = container lên được VÀ nói được với DB.
      - name: Chờ hai service stable
        id: stable
        run: |
          set -euo pipefail
          echo "Deploy có downtime ~20-40s theo thiết kế (static host port + 1 instance)."
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "$SERVICE_WEB" "$SERVICE_API"
          echo "Cả hai service đã stable."

      # Chỉ để THÔNG BÁO, không phải gate — và đó là chủ ý. Bước này đi qua
      # Cloudflare, nên nó fail cả khi DNS chưa trỏ đúng hoặc proxy sai chế độ.
      # Rollback vì lỗi DNS trong khi container hoàn toàn khoẻ là rollback sai.
      # Tín hiệu sức khoẻ có thẩm quyền là target group, đã kiểm ở bước trên.
      - name: Kiểm tra qua domain công khai (không gate)
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                     "${API_BASE_URL}/health/ready" || echo 000)
            echo "  lần $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning title=Không gọi được qua domain::Container đã stable (target group healthy) nhưng ${API_BASE_URL}/health/ready không trả 200. Nghi vấn ở tầng DNS/Cloudflare, không phải ở tầng ứng dụng. Kiểm tra CNAME của alb và chế độ proxy."

      # ─── ROLLBACK ────────────────────────────────────────────────
      # Chỉ chạy khi một bước phía trên fail. Không rollback migration: chính
      # sách là forward-only, và schema mới phải tương thích ngược với app cũ
      # (thêm column nullable trước, backfill, siết constraint ở lần sau). Nếu
      # dữ liệu thật sự hỏng thì đường về là snapshot $SNAP, và đó là quyết định
      # của người, không phải của pipeline.
      - name: Rollback về revision trước
        if: failure() && env.PREV_API != ''
        run: |
          set -uo pipefail
          echo "::warning title=Đang rollback::Trỏ hai service về revision trước khi deploy."
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE_API" \
            --task-definition "$PREV_API" --no-cli-pager >/dev/null || true
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE_WEB" \
            --task-definition "$PREV_WEB" --no-cli-pager >/dev/null || true
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "$SERVICE_WEB" "$SERVICE_API" || true
          echo "Đã trỏ về: api=$PREV_API  web=$PREV_WEB"
          # `${SNAP:-...}` vì bước này chạy dưới `set -u` và SNAP chỉ tồn tại
          # sau khi bước snapshot đã ghi nó vào $GITHUB_ENV. Cửa sổ hẹp, nhưng
          # một lần fail đúng trong cửa sổ đó sẽ cho "SNAP: unbound variable"
          # ĐÈ LÊN lỗi thật — đúng lúc đang rollback.
          echo "LƯU Ý: migration KHÔNG được rollback. Snapshot dữ liệu: ${SNAP:-(chưa tạo)}"

      - name: Dọn snapshot cũ, giữ 3 cái mới nhất
        if: always()
        run: |
          set -uo pipefail
          # Quyền xoá bị ghim theo ARN pattern snapshot:pre-migrate-* trong IAM
          # policy, nên bước này KHÔNG thể chạm tới snapshot người tạo tay hay
          # final snapshot lúc destroy — ranh giới an toàn nằm ở IAM, không nằm
          # ở logic của đoạn script này.
          #
          # `|| true` trên lệnh describe là BẮT BUỘC, không phải cho chắc: shell
          # mặc định của Actions là `bash -e {0}`, nên `-e` đang bật và
          # `set -uo pipefail` không tắt nó. Một lỗi ở đây (JMESPath vấp kiểu
          # null, hoặc RDS trả lỗi tạm) sẽ làm bước này đỏ → job `deploy` đỏ →
          # job `summary` in "Deploy KHÔNG thành công" cho một lần deploy đã
          # hoàn tất trọn vẹn, rồi mời người ta rollback một bản tốt. Dọn rác
          # thất bại không được phép đổi kết luận về deploy.
          #
          # Lọc `Status == 'available'` trước khi sort vì hai lẽ: chỉ snapshot
          # đã hoàn tất mới có SnapshotCreateTime đáng tin (cái mà chính run này
          # vừa tạo còn đang `creating`, và sort_by trên một field null là lỗi),
          # và ta cũng không muốn xoá một snapshot đang tạo. Hệ quả của phép lọc
          # là tập ứng viên NHỎ HƠN, nên nó chỉ có thể xoá ÍT hơn chứ không bao
          # giờ nhiều hơn: "giữ 3 available mới nhất" cộng snapshot đang tạo.
          #
          # Hứng ra biến rồi mới lặp, thay vì `describe | while`: `||` có độ ưu
          # tiên THẤP hơn `|`, nên `describe ... || true | tr | while` sẽ được
          # bash phân tích thành `describe || (true | tr | while ...)` — tức
          # đúng lúc describe THÀNH CÔNG thì vòng lặp không nhận được gì.
          olds=$(aws rds describe-db-snapshots --snapshot-type manual \
                   --query "reverse(sort_by(DBSnapshots[?starts_with(DBSnapshotIdentifier, 'pre-migrate-') && Status == 'available'], &SnapshotCreateTime))[3:].DBSnapshotIdentifier" \
                   --output text --no-cli-pager 2>/dev/null || true)

          for old in $olds; do
            # `--output text` in "None" khi query không khớp gì.
            if [ "$old" = "None" ]; then continue; fi
            echo "Xoá snapshot cũ: $old"
            aws rds delete-db-snapshot --db-snapshot-identifier "$old" --no-cli-pager >/dev/null || true
          done

  # ───────────────────────────────────────────────────────────────
  # SUMMARY — luôn chạy. Đây là thứ trả lời câu "vừa rồi có deploy không".
  # ───────────────────────────────────────────────────────────────
  summary:
    name: Tổng kết
    runs-on: ubuntu-latest
    needs: [build, migration-script, preflight, deploy]
    if: always()

    steps:
      - name: Ghi summary
        # Mọi giá trị động đi qua `env:` chứ không nội suy `${{ }}` thẳng vào
        # thân shell. Ở đây chúng đến từ AWS API và từ script của chính ta nên
        # không phải dữ liệu của kẻ tấn công, nhưng nội suy thẳng vào shell là
        # thói quen sai — chỉ cần một ngày có người thêm một giá trị lấy từ
        # event của GitHub là thành lỗ command injection.
        env:
          R_BUILD: ${{ needs.build.result }}
          R_SCRIPT: ${{ needs.migration-script.result }}
          R_PREFLIGHT: ${{ needs.preflight.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
          READY: ${{ needs.preflight.outputs.ready }}
          REASON: ${{ needs.preflight.outputs.reason }}
        run: |
          {
            echo "## Deploy \`${GITHUB_SHA::8}\`"
            echo
            echo "| Bước | Kết quả |"
            echo "|---|---|"
            echo "| Build 4 image | \`$R_BUILD\` |"
            echo "| Script migration | \`$R_SCRIPT\` |"
            echo "| Preflight | \`$R_PREFLIGHT\` |"
            echo "| Deploy | \`$R_DEPLOY\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Rẽ theo KẾT QUẢ của preflight TRƯỚC, rồi mới theo nội dung của nó.
          # `ready` chỉ có giá trị khi job preflight chạy xong: nếu nó fail
          # (AccessDenied, throttling, thiếu repository variable) thì cả `ready`
          # lẫn `reason` đều là chuỗi RỖNG. Rẽ thẳng theo `READY = 'true'` sẽ đẩy
          # mọi thất bại đó vào nhánh "hạ tầng đang tắt" — in "đây là trạng thái
          # bình thường, không phải lỗi" kèm một blockquote trống, trong khi bảng
          # ngay phía trên nói `| Preflight | failure |`. Một summary tự mâu thuẫn
          # còn tệ hơn không có summary.
          if [ "$R_PREFLIGHT" != "success" ]; then
            {
              echo "### CHƯA BIẾT TRẠNG THÁI HẠ TẦNG — preflight không chạy xong"
              echo
              echo "Job \`preflight\` kết thúc ở \`$R_PREFLIGHT\`, nên **không** kết luận được là hạ tầng đang bật hay đang tắt, và job \`deploy\` bị bỏ qua."
              echo
              echo "4 image vẫn nằm trên ECR ở tag \`${GITHUB_SHA}\` nếu job \`build\` xanh (\`$R_BUILD\`)."
              echo
              echo "Chỗ cần xem: log job \`preflight\`. Ba nguyên nhân thường gặp là thiếu repository variable \`AWS_DEPLOY_ROLE_ARN\`, OIDC không đổi được token, và AWS trả lỗi tạm cho một trong ba lệnh describe."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$READY" = "true" ]; then
            if [ "$R_DEPLOY" = "success" ]; then
              echo "**Đã deploy.** Hai service đang chạy image tag \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**Deploy KHÔNG thành công** (\`$R_DEPLOY\`). Xem log job \`deploy\`." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo "### CHƯA DEPLOY — chỉ build và push image"
              echo
              echo "Hạ tầng đang tắt. Đây là **trạng thái bình thường** của dự án này, không phải lỗi:"
              echo
              echo "> $REASON"
              echo
              echo "4 image đã nằm trên ECR ở tag \`${GITHUB_SHA}\`. Để đưa chúng lên chạy:"
              echo
              echo '```bash'
              echo "sed -i '' 's|^image_tag = .*|image_tag = \"${GITHUB_SHA}\"|' infra/tf/envs/prod/terraform.tfvars"
              echo "bash infra/tf/scripts/up.sh"
              echo '```'
              echo
              echo "Pipeline **không tự bật hạ tầng** — mỗi giờ bật tốn \$0.1954, và một pipeline tự bật là chi phí không có trần. IAM role của nó cũng không có quyền để làm việc đó."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
