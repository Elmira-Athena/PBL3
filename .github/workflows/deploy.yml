name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    if: >
      contains(github.event.head_commit.message, '[skip-frontend]') == false
    # Chỉ chạy khi có thay đổi trong Client hoặc Shared
    # Dùng paths filter ở workflow level không được khi 2 jobs riêng,
    # nên dùng paths-filter action bên dưới

    steps:
      - uses: actions/checkout@v4

      - name: Check changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'src/Client/**'
              - 'src/Shared/**'

      - uses: actions/setup-dotnet@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Build Blazor WASM
        if: steps.changes.outputs.frontend == 'true'
        run: |
          dotnet publish src/Client/Client.csproj \
            -c Release -o /tmp/blazor-out \
            --nologo -v q

      - name: Setup SSH
        if: steps.changes.outputs.frontend == 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Rsync to EC2
        if: steps.changes.outputs.frontend == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          rsync -a --delete \
            -e "ssh -i ~/.ssh/deploy.pem" \
            /tmp/blazor-out/wwwroot/ \
            ubuntu@$EC2_HOST:/var/www/hushstore/wwwroot/
          echo "Frontend deployed successfully"

  deploy-api:
    name: Build & Deploy API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'src/API/**'
              - 'src/Service/**'
              - 'src/Infrastructure/**'
              - 'src/Core/**'
              - 'src/Shared/**'
              - 'Dockerfile'
              - 'docker-compose.yml'

      - name: Setup SSH
        if: steps.changes.outputs.api == 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Pull, build & restart API on EC2
        if: steps.changes.outputs.api == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy.pem ubuntu@$EC2_HOST << 'ENDSSH'
            set -e
            cd /opt/hushstore
            git pull origin main
            sudo docker compose build api
            sudo docker compose up -d api
            echo "API container restarted"
          ENDSSH

      - name: Health check
        if: steps.changes.outputs.api == 'true'
        run: |
          echo "Waiting 30s for API startup..."
          sleep 30
          for i in 1 2 3 4 5; do
            if curl -sf https://api.athena232.io.vn/health > /dev/null; then
              echo "✓ API is healthy"
              exit 0
            fi
            echo "Retry $i/5 (waiting 15s)..."
            sleep 15
          done
          echo "✗ Health check failed"
          exit 1
