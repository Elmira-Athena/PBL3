# Kiểm tra trên PR, trên push vào `main`, và khi bấm chạy tay.
# Nhánh feature được phủ qua PR của nó, không qua event `push`.
#
# ─── VÌ SAO TRIGGER PHẢI GỒM CẢ `push: main` ─────────────────────────────────
# Quy ước làm việc của dự án này là commit THẲNG lên `main` (Phase 1 làm 17 task
# như vậy, Phase 2 cũng vậy). Bản đầu của file này trigger `pull_request` +
# `push: branches-ignore: [main]`, nên dưới đúng quy ước đó nó KHÔNG BAO GIỜ
# chạy: không có PR nào, và nhánh duy nhất có commit thì bị loại tường minh. Một
# cửa kiểm không bao giờ mở thì không phải cửa kiểm.
# `workflow_dispatch` có ở đây để còn chạy thử được bằng tay từ tab Actions.
#
# ─── VÌ SAO KHÔNG CÓ `terraform plan` Ở ĐÂY ──────────────────────────────────
# Kế hoạch ban đầu là chạy `plan` rồi comment kết quả vào PR. Bỏ, có chủ ý.
#
# `plan` phải đọc terraform.tfstate, và state CHỨA master password của RDS ở
# dạng plaintext — `random_password` luôn nằm trong state, đó là bản chất của
# Terraform chứ không phải cấu hình sai ở phía ta. Nên một role đọc được state
# là một role đọc được mật khẩu DB.
#
# Với trigger `pull_request`, claim `sub` của OIDC token là
# `repo:Elmira-Athena/PBL3:pull_request` — giá trị này KHÔNG phân biệt được PR
# do chủ repo mở với PR từ một fork. Đánh đổi sai chiều: tiện lợi của một comment
# tự động không đáng bằng rủi ro để mật khẩu DB nằm sau một ranh giới mờ.
#
# Vì thế `hushstore-github-actions-plan-role` bị Deny tường minh `s3:GetObject`
# (xem infra/tf/modules/cicd/policy.tf) — nó KHÔNG đọc được state, kể cả khi ai
# đó thêm workflow gọi plan. Ràng buộc nằm ở IAM, không nằm ở file này.
#
# Đường nâng cấp nếu sau này muốn plan trên PR: dùng GitHub Environment có
# required reviewer. Khi job khai báo `environment:`, claim sub thành
# `repo:.../environment:<tên>` và fork không lấy được token mà không có người
# bấm duyệt. Đó là cấu hình trên GitHub, không phải Terraform.
#
# Thứ CÓ ở đây và có giá trị hơn plan: `terraform test`. 11 file test đang canh
# các assertion bảo mật (NACL stateless, SG không mở 22, IAM least privilege).
# Chúng chạy được mà không cần state.
#
# `terraform test` chạy được trên push main vì trust policy của role plan nhận
# HAI giá trị `sub` (pull_request và ref:refs/heads/main), cả hai đều là
# `StringEquals` — so khớp chính xác, không wildcard. Xem
# infra/tf/modules/cicd/main.tf, data "assume_plan".

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: 1.15.8

jobs:
  # ───────────────────────────────────────────────────────────────
  # Định dạng và cú pháp — KHÔNG cần credential AWS.
  # `init -backend=false` bỏ qua hoàn toàn cấu hình backend S3, nên bước này
  # chạy được cả khi không có quyền nào trên AWS.
  # ───────────────────────────────────────────────────────────────
  terraform-static:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: fmt -check
        run: terraform -chdir=infra/tf fmt -check -recursive -diff

      - name: validate mọi module và env
        run: |
          set -euo pipefail
          fail=0
          for dir in infra/tf/envs/prod infra/tf/modules/*/; do
            echo "── $dir"
            # `init` cũng phải `|| continue`, không chỉ `validate`. Dưới `set -e`
            # một init lỗi sẽ giết cả bước và bỏ qua toàn bộ module còn lại —
            # phá đúng thiết kế "gom hết lỗi rồi exit $fail một lần". Init lỗi
            # thì validate của cùng thư mục đó cũng vô nghĩa, nên `continue`.
            terraform -chdir="$dir" init -backend=false -input=false -no-color >/dev/null \
              || { echo "::error::init thất bại ở $dir"; fail=1; continue; }
            terraform -chdir="$dir" validate -no-color || fail=1
          done
          exit $fail

  # ───────────────────────────────────────────────────────────────
  # terraform test — CẦN credential vì một số module có data source gọi AWS
  # thật (aws_caller_identity, và aws_ssm_parameter đọc AMI ECS-optimized do
  # AWS công bố công khai).
  # ───────────────────────────────────────────────────────────────
  terraform-test:
    name: Terraform test
    runs-on: ubuntu-latest

    # Gate này lọc đúng những lần chạy KHÔNG có role nào để assume. Một job đỏ
    # vì thiếu quyền theo thiết kế là tín hiệu nhiễu — nó che mất những job đỏ
    # thật.
    #
    #   • push (chỉ có thể là push vào `main`, theo trigger ở đầu file): claim
    #     sub là `repo:Elmira-Athena/PBL3:ref:refs/heads/main`, và role
    #     plan nhận đúng giá trị đó — xem local.sub_deploy trong danh sách
    #     `values` của assume_plan (modules/cicd/main.tf). Push một nhánh khác
    #     thì sub là `...:ref:refs/heads/<nhánh>`, không khớp role nào; trigger
    #     `push` đã giới hạn ở `main` nên trường hợp đó không tới được đây.
    #     KHÔNG nới trust policy sang `ref:refs/heads/*` để phủ nhánh feature:
    #     làm vậy là cấp ReadOnlyAccess cho mọi nhánh, kể cả nhánh do người khác
    #     đẩy lên. Nhánh feature được phủ khi nó mở PR.
    #   • `head.repo.full_name == github.repository`: PR từ fork không được
    #     GitHub cấp `id-token: write`, nên không có OIDC token nào để đổi.
    #
    # Điều kiện viết ở dạng "chỉ LOẠI fork PR" chứ không phải "chỉ NHẬN push và
    # PR": nếu viết dạng liệt kê thì `workflow_dispatch` rơi ra ngoài và bị skip,
    # tức mất đúng cái mà workflow_dispatch được thêm vào để làm — chạy thử
    # `terraform test` bằng tay. Dispatch từ `main` thì sub khớp role plan và
    # chạy được; dispatch từ ref khác sẽ đỏ ở bước assume-role, và với một lần
    # chạy do người bấm thì đỏ tường minh tốt hơn là bị bỏ qua im lặng.
    #
    # Hai job kia (fmt/validate và dotnet build) không cần credential nên chạy
    # cho mọi lần trigger, gồm cả PR từ fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Assume role qua OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tf-test

      # 10 trong 11 file test khai báo `provider "aws" { profile = "hushstore" }`
      # — đó là profile SSO trên máy của người phát triển. (File thứ 11,
      # modules/alb/tests/alb.tftest.hcl, dùng `mock_provider` có chủ ý để chạy
      # offline, nên nó không cần profile nào.) Trên runner không có profile
      # nào, nên tạo một profile CÙNG TÊN trỏ vào credential tạm mà
      # configure-aws-credentials vừa export ra biến môi trường. Cách này giữ
      # 10 file test nguyên vẹn, thay vì sửa provider block ở cả 10 chỗ rồi làm
      # hỏng cách chạy test trên máy cá nhân.
      #
      # `aws configure set` GHI RA ĐĨA: nó tạo/ghi `~/.aws/credentials` của
      # runner, không chỉ đặt biến môi trường. Chấp nhận được vì đây là
      # credential TẠM, hạn 1 giờ, trên một runner dùng một lần rồi hủy. Nó
      # cũng bị Deny tường minh s3:GetObject và kms:Decrypt, nên kể cả file đó
      # bị đọc thì cũng không mở được state hay secret nào.
      #
      # Không dùng `credential_source = Environment` trong `~/.aws/config`:
      # tham số đó của AWS CLI chỉ hợp lệ khi ĐI KÈM `role_arn` — nó trả lời
      # câu "lấy credential ở đâu để assume role kia". Một profile chỉ có
      # `credential_source` mà không có `role_arn` bị CLI từ chối.
      - name: Tạo profile hushstore từ credential OIDC
        run: |
          aws configure set --profile hushstore region        "$AWS_REGION"
          aws configure set --profile hushstore aws_access_key_id     "$AWS_ACCESS_KEY_ID"
          aws configure set --profile hushstore aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set --profile hushstore aws_session_token     "$AWS_SESSION_TOKEN"
          aws sts get-caller-identity --profile hushstore --no-cli-pager

      - name: Chạy test từng module
        run: |
          set -uo pipefail
          fail=0
          ran=0
          for dir in infra/tf/modules/*/; do
            [ -d "${dir}tests" ] || continue
            ran=$((ran + 1))
            echo "════ $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$dir" test -no-color || fail=1
          done
          echo "Đã chạy test cho $ran module."
          # Không có module nào có test là một sự cố, không phải một kết quả tốt.
          [ "$ran" -gt 0 ] || { echo "::error::Không tìm thấy thư mục tests/ nào."; exit 1; }
          exit $fail

  # ───────────────────────────────────────────────────────────────
  # Biên dịch .NET. Dự án chưa có test tự động nào, nên `dotnet build` là cửa
  # kiểm duy nhất cho code C# — và nó bắt được đúng loại lỗi mà pipeline deploy
  # sẽ gặp muộn hơn nhiều (lúc build image, sau khi đã tốn phút runner).
  # ───────────────────────────────────────────────────────────────
  dotnet-build:
    name: dotnet build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore và build
        # -warnaserror KHÔNG bật: solution hiện còn warning, và biến chúng thành
        # lỗi ở đây sẽ chặn mọi PR vì những thứ không liên quan tới PR đó. Dọn
        # warning là việc riêng, không phải việc của cửa kiểm này.
        run: |
          dotnet restore PBL3.sln
          dotnet build PBL3.sln -c Release --no-restore --nologo
